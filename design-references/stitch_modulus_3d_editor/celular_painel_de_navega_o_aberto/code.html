<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Modulus Hub - Menu de Navegação Aberto (Celular)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              primary: '#2b00ff',
              primaryHover: '#2200cc',
              primaryLight: '#ebeaff',
              dark: '#152336',
              accent: '#ff4e26',
              surface: '#ffffff',
              bg: '#f8f9fc',
              border: '#e2e6ed',
              textPrimary: '#111827',
              textSecondary: '#4b5563',
              textMuted: '#9ca3af'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['"Space Grotesk"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 450, 'GRAD' 0, 'opsz' 20;
    }
    .material-symbols-outlined.filled {
      font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 20;
    }
  </style>
</head>
<body class="bg-brand-bg text-brand-textPrimary font-sans antialiased min-h-screen relative max-w-md mx-auto border-x border-brand-border overflow-hidden">

  <!-- TELA DE FUNDO (DIMMED COM BACKDROP) -->
  <div class="opacity-30 pointer-events-none filter blur-[1px] p-4 space-y-4">
    <div class="h-10 bg-white rounded-lg border border-slate-200"></div>
    <div class="h-8 bg-slate-200 rounded w-1/3"></div>
    <div class="h-12 bg-white rounded-xl border border-slate-200"></div>
    <div class="h-20 bg-white rounded-xl border border-slate-200"></div>
    <div class="h-20 bg-white rounded-xl border border-slate-200"></div>
  </div>

  <!-- OVERLAY ESCURECIDO -->
  <div class="fixed inset-0 bg-slate-900/40 backdrop-blur-[2px] z-30"></div>

  <!-- PAINEL DE NAVEGAÇÃO LATERAL MOBILE (DRAWER) -->
  <div class="fixed inset-y-0 left-0 w-[85%] max-w-[320px] bg-white z-40 flex flex-col justify-between shadow-2xl border-r border-brand-border animate-in slide-in-from-left duration-200">
    
    <!-- CABEÇALHO DO PAINEL MOBILE -->
    <div class="p-4 border-b border-brand-border flex items-center justify-between bg-slate-50/80">
      <div class="flex items-center gap-2.5">
        <!-- Logo Isotipo -->
        <div class="w-8 h-8 rounded-lg bg-brand-primary flex items-center justify-center text-white shrink-0 shadow-xs">
          <svg class="w-4 h-4 fill-current" viewBox="0 0 28 28">
            <path d="M 0,7.8 L 10.2,1.2 L 10.2,9.4 L 17.8,14.2 L 28,7.8 L 28,20.2 L 17.8,26.8 L 17.8,18.6 L 10.2,13.8 L 0,20.2 Z" fill="#ffffff"></path>
            <polygon fill="#d5dcff" points="10.2,1.2 17.8,6.1 17.8,14.2 10.2,9.4"></polygon>
          </svg>
        </div>
        <div class="flex flex-col">
          <div class="flex items-center gap-1">
            <span class="font-display font-bold text-sm tracking-tight text-brand-dark">Modulus</span>
            <span class="text-[9px] font-semibold bg-brand-primaryLight text-brand-primary px-1 py-0.2 rounded font-display uppercase">Hub</span>
          </div>
          <!-- Identificação da Empresa -->
          <span class="text-[11px] text-brand-textSecondary font-medium truncate">Oficina 3D Criativa</span>
        </div>
      </div>

      <!-- Controle para Fechar -->
      <button class="w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:text-brand-dark hover:bg-slate-200 transition-colors" aria-label="Fechar navegação">
        <span class="material-symbols-outlined text-xl">close</span>
      </button>
    </div>

    <!-- LISTA DE GRUPOS E SEÇÕES (MESMOS GRUPOS DO DESKTOP) -->
    <nav class="flex-1 overflow-y-auto px-3 py-4 space-y-5">
      <!-- Grupo: Visão Geral -->
      <div>
        <span class="px-3 text-[10px] font-semibold uppercase tracking-wider text-brand-textMuted font-display">Visão geral</span>
        <div class="mt-1 space-y-0.5">
          <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-brand-textSecondary hover:bg-slate-50 transition-colors">
            <span class="material-symbols-outlined text-xl text-slate-400">dashboard</span>
            <span>Dashboard</span>
          </a>
        </div>
      </div>

      <!-- Grupo: Operação (Com Seção Produtos Ativa) -->
      <div>
        <span class="px-3 text-[10px] font-semibold uppercase tracking-wider text-brand-textMuted font-display">Operação</span>
        <div class="mt-1 space-y-0.5">
          <!-- Item Ativo -->
          <a href="#" class="flex items-center justify-between px-3 py-2.5 rounded-lg text-sm font-semibold bg-brand-primaryLight text-brand-primary border-l-2 border-brand-primary transition-all">
            <div class="flex items-center gap-3">
              <span class="material-symbols-outlined text-xl filled text-brand-primary">inventory_2</span>
              <span>Produtos</span>
            </div>
            <span class="w-1.5 h-1.5 rounded-full bg-brand-primary"></span>
          </a>

          <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-brand-textSecondary hover:bg-slate-50 transition-colors">
            <span class="material-symbols-outlined text-xl text-slate-400">calculate</span>
            <span>Precificadora</span>
          </a>
        </div>
      </div>

      <!-- Grupo: Recursos -->
      <div>
        <span class="px-3 text-[10px] font-semibold uppercase tracking-wider text-brand-textMuted font-display">Recursos</span>
        <div class="mt-1 space-y-0.5">
          <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-brand-textSecondary hover:bg-slate-50 transition-colors">
            <span class="material-symbols-outlined text-xl text-slate-400">print</span>
            <span>Impressoras</span>
          </a>
          <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-brand-textSecondary hover:bg-slate-50 transition-colors">
            <span class="material-symbols-outlined text-xl text-slate-400">category</span>
            <span>Materiais</span>
          </a>
        </div>
      </div>

      <!-- Grupo: Gestão (Perfil Proprietário) -->
      <div>
        <span class="px-3 text-[10px] font-semibold uppercase tracking-wider text-brand-textMuted font-display">Gestão</span>
        <div class="mt-1 space-y-0.5">
          <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-brand-textSecondary hover:bg-slate-50 transition-colors">
            <span class="material-symbols-outlined text-xl text-slate-400">business</span>
            <span>Empresa</span>
          </a>
          <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-brand-textSecondary hover:bg-slate-50 transition-colors">
            <span class="material-symbols-outlined text-xl text-slate-400">group</span>
            <span>Equipe</span>
          </a>
        </div>
      </div>
    </nav>

    <!-- RODAPÉ DO PAINEL: USUÁRIO, PAPEL E BOTÃO SAIR -->
    <div class="p-3 border-t border-brand-border bg-slate-50">
      <div class="flex items-center justify-between gap-2 p-1.5 rounded-lg">
        <div class="flex items-center gap-2.5 overflow-hidden">
          <div class="w-9 h-9 rounded-full bg-brand-dark text-white font-display font-semibold text-xs flex items-center justify-center shrink-0">
            RM
          </div>
          <div class="flex flex-col overflow-hidden">
            <span class="text-xs font-semibold text-brand-dark truncate">Rafael Moura</span>
            <span class="text-[11px] text-brand-textSecondary truncate">Proprietário</span>
          </div>
        </div>
        <button class="w-9 h-9 rounded-lg flex items-center justify-center text-slate-400 hover:text-brand-accent hover:bg-red-50 transition-colors border border-slate-200 bg-white" title="Sair da conta" aria-label="Sair">
          <span class="material-symbols-outlined text-lg">logout</span>
        </button>
      </div>
    </div>

  </div>

</body>
</html>
